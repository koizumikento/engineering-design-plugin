[project]
name = "engineering-design-plugin"
version = "0.3.0"
description = "Engineering design agent skills and helper scripts."
requires-python = ">=3.11,<3.12"
dependencies = [
    "build123d==0.11.1",
    "matplotlib>=3.5",
    "numpy>=1.20",
    "numpy-stl>=2.16",
    "PySpice>=1.5",
    "skidl>=2.2.1,<2.3",
]

[project.optional-dependencies]
preview = [
    "vtk>=9.0",
]

[tool.uv]
package = false
