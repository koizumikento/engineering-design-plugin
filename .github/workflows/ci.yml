name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin and CAD workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      UV_MANAGED_PYTHON: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v9
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install managed Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Check packaged plugin is synchronized
        run: |
          uv run python scripts/sync_codex_plugin_package.py
          git diff --exit-code

      - name: Validate release metadata and skills
        run: uv run python scripts/validate_release.py

      - name: Run regression tests
        run: uv run python -m unittest discover -s tests
